# Strict Python template: all ruff rules except those that fight the formatter or ~/.claude/rules/.
# In pyproject.toml prefix every section with tool.ruff; uv.lock pins ruff, so new rules arrive on update.
line-length = 100

[lint]
select = ["ALL"]
ignore = [
  "D", "CPY", # docstrings everywhere and copyright headers fight the comment rule
  "COM812", "ISC001", "E501", # the formatter owns commas and line length
  "RUF001", # non-Latin letters in user-facing strings are fine
  "TRY003", "EM101", "EM102", # message text inside the exception
  "FBT003", # positional booleans in calls to foreign APIs
  "PLR2004", # magic numbers: noise, review checks constant names
  "INP001", # implicit namespace packages
  "FIX", "TD", # review handles TODO
]

[lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "ANN", "PLR0913", "PLR0915", "PLR0917", "SLF001", "S105", "S106", "S311"]
"**/test_*.py" = ["S101", "ARG", "ANN", "PLR0913", "PLR0915", "PLR0917", "SLF001", "S105", "S106", "S311"]
"**/conftest.py" = ["S101", "ARG", "ANN"]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 6
