# Copy to ~/.config/tiny-symphony/config.toml; the prompts/ folder goes next to it.
backlog_dir = "~/Dev/backlog"
workspace_root = "~/.local/share/tiny-symphony/work"
run_timeout_minutes = 60

# Backlog.md project (the task's `project` field) -> git repository.
[projects.toy]
repo = "~/Dev/toy-repo"

# A task needs the label agent:<name>, for example agent:claude.
[agents.claude]
cmd = ["claude", "-p", "--permission-mode", "auto", "{prompt}"]
